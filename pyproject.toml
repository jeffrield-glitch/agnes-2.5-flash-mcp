[project]
name = "agnes-2.5-flash-mcp"
version = "0.1.0"
description = "Agnes Image/Video 2.5 Flash MCP Server (stdio) - 2.5-flash-only edition for any MCP-compatible IDE"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "agnes-2.5-flash-mcp contributors" }]
keywords = ["mcp", "model-context-protocol", "agnes", "agnes-2.5-flash", "image-generation", "video-generation"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Multimedia :: Graphics",
  "Topic :: Multimedia :: Video",
]
dependencies = [
  "mcp>=1.9.0,<2",
  "httpx>=0.27.0",
  "python-dotenv>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/JasonOracle/agnes-2.5-flash-mcp"
Repository = "https://github.com/JasonOracle/agnes-2.5-flash-mcp"
Issues = "https://github.com/JasonOracle/agnes-2.5-flash-mcp/issues"

[project.scripts]
"agnes-2.5-flash-mcp" = "agnes_2_5_flash_mcp.server:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
